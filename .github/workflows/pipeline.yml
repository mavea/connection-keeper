name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lint
        run: make lint

  generate-compare:
    name: Check generated files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check generation result
        run: make generate-compare

  build-examples:
    name: Build examples
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - lint
      - generate-compare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile examples
        run: make build-examples

